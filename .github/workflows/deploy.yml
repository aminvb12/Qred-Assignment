name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: qred-assignment
  ECS_CLUSTER: qred-cluster
  ECS_SERVICE: qred-service

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target production \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            --push .

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for deployment
        run: |
          for i in $(seq 1 24); do
            STATUS=$(aws ecs describe-services \
              --cluster $ECS_CLUSTER \
              --services $ECS_SERVICE \
              --region $AWS_REGION \
              --query 'services[0].deployments' \
              --output json)
            RUNNING=$(echo $STATUS | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(x['runningCount'] for x in d if x['status']=='PRIMARY'))")
            DESIRED=$(echo $STATUS | python3 -c "import sys,json; d=json.load(sys.stdin); print(next(x['desiredCount'] for x in d if x['status']=='PRIMARY'))")
            COUNT=$(echo $STATUS | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
            echo "Attempt $i: deployments=$COUNT running=$RUNNING desired=$DESIRED"
            if [ "$COUNT" = "1" ] && [ "$RUNNING" = "$DESIRED" ]; then
              echo "Deployment stable!"
              exit 0
            fi
            sleep 15
          done
          echo "Deployment did not stabilize — fetching logs..."
          TASK=$(aws ecs list-tasks --cluster $ECS_CLUSTER --service-name $ECS_SERVICE --region $AWS_REGION --query 'taskArns[0]' --output text)
          aws logs get-log-events \
            --log-group-name /ecs/qred-assignment \
            --log-stream-name $(aws logs describe-log-streams --log-group-name /ecs/qred-assignment --order-by LastEventTime --descending --limit 1 --query 'logStreams[0].logStreamName' --output text --region $AWS_REGION) \
            --limit 50 \
            --region $AWS_REGION \
            --query 'events[*].message' \
            --output text
          exit 1
