AWSTemplateFormatVersion: '2010-09-09'
Description: NestJS App - ECR, ECS, ALB

Parameters:
  ImageTag:
    Type: String
    Default: latest
  AccountId:
    Type: String

Resources:

  # ── ECR ────────────────────────────────────────────────────────────────────
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: qred-assignment
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": {
                "tagStatus": "untagged",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": { "type": "expire" }
            }]
          }

  # ── ECS Cluster ────────────────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: qred-cluster

  # ── IAM Role for ECS Task ──────────────────────────────────────────────────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: qred-ecs-task-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !ImportValue qred-DBSecretArn

  # ── IAM Role for ECS Task (runtime permissions) ───────────────────────────
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: qred-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SSMMessagesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: '*'

  # ── CloudWatch Log Group ───────────────────────────────────────────────────
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/qred-assignment
      RetentionInDays: 30

  # ── ECS Task Definition ────────────────────────────────────────────────────
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: qred-assignment
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: qred-assignment
          Image: !Sub ${AccountId}.dkr.ecr.us-east-1.amazonaws.com/qred-assignment:${ImageTag}
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
          Secrets:
            - Name: DB_HOST
              ValueFrom: !Join ['', [!ImportValue qred-DBSecretArn, ':host::']]
            - Name: DB_PORT
              ValueFrom: !Join ['', [!ImportValue qred-DBSecretArn, ':port::']]
            - Name: DB_USERNAME
              ValueFrom: !Join ['', [!ImportValue qred-DBSecretArn, ':username::']]
            - Name: DB_PASSWORD
              ValueFrom: !Join ['', [!ImportValue qred-DBSecretArn, ':password::']]
            - Name: DB_NAME
              ValueFrom: !Join ['', [!ImportValue qred-DBSecretArn, ':dbname::']]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/qred-assignment
              awslogs-region: us-east-1
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - wget -qO- http://localhost:3000/api/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3

  # ── ALB ────────────────────────────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: qred-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !ImportValue qred-PublicSubnetA
        - !ImportValue qred-PublicSubnetB
      SecurityGroups:
        - !ImportValue qred-ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: qred-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !ImportValue qred-VPCId
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  # ── ECS Service ────────────────────────────────────────────────────────────
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: qred-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue qred-PrivateSubnetA
            - !ImportValue qred-PrivateSubnetB
          SecurityGroups:
            - !ImportValue qred-ECSSecurityGroup
      LoadBalancers:
        - ContainerName: qred-assignment
          ContainerPort: 3000
          TargetGroupArn: !Ref ALBTargetGroup

Outputs:
  ALBDNSName:
    Value: !GetAtt ALB.DNSName
    Description: Application Load Balancer DNS - your app URL
